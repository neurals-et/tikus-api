[package]
name = "tikus-api"
version = "0.1.0"
edition = "2021"
authors = ["Neurals-et <contact@neurals.et>"]
description = "Fast, asynchronous Rust API client for the Tikus Ethiopian social, short-video & live streaming platform"
license = "MIT"
repository = "https://github.com/neurals-et/tikus-api"
homepage = "https://github.com/neurals-et/tikus-api"
readme = "README.md"
keywords = ["tikus", "api", "client", "streaming", "social"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
url = "2.5"

[dev-dependencies]
tracing-subscriber = "0.3"
